# Continuous integration, see ADR-0016 for the choices made here.
#
# The first job needs no database and answers within a minute. The second job
# starts the Compose stack exactly as the README does and runs the integration
# tests against it, so that a change that breaks the fresh clone is found on the
# remote and not by the next reader.
name: ci

on:
  push:
  pull_request:

# Nothing in the workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the run of the older one obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version of the image of the loader (Dockerfile), so that the checks run
  # with the tool that built the image.
  UV_VERSION: "0.12.23"
  # The interpreter is the one that setup-python provides, never a downloaded one,
  # as in the Dockerfile.
  UV_PYTHON_DOWNLOADS: never

jobs:
  static:
    name: ruff and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install "uv==${UV_VERSION}"
      # `--locked` fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit

  integration:
    name: integration tests on the Compose stack
    # The stack is not started when the cheap checks have failed.
    needs: static
    runs-on: ubuntu-24.04
    # The suite takes about eight minutes on a development machine, and the
    # runner is slower than that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --locked
      # The detached start returns when the loader has started. The loader is a
      # one shot service, so the step then waits for it and fails with its exit
      # code, which the tests check again afterwards.
      - name: Start the stack and wait for the loader
        run: |
          docker compose up --build --detach
          code="$(docker wait "$(docker compose ps --all --quiet loader)")"
          echo "the loader exited with code ${code}"
          test "${code}" -eq 0
      - run: uv run pytest -m integration
      - name: Logs of the stack after a failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
